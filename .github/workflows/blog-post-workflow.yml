name: Latest blog posts

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    name: Pull latest posts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://www.fixyour.org/feed.xml"
          max_post_count: 4
          template: "$newline- [$title]($url) — $date"
          date_format: "mmm d, yyyy"
          commit_message: "chore: refresh blog posts"
